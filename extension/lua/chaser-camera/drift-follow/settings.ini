[SETTINGS]
PRESET = 0 ; Preset; 0 for Driving, 1 for Cinematic
DISTANCE = 6 ; Camera distance (far chase adds 1.5 m, cinematic adds 0.6 m); from 3 m to 12, round to 0.1
HEIGHT = 1.8 ; Camera height (far chase adds 0.25 m, cinematic adds 0.15 m); from 0.7 m to 4, round to 0.1
FOV = 50 ; Field of view (cinematic subtracts 4 degrees); from 35 to 95, round to 1
SLIDE_FOLLOW = 0.65 ; Slide following strength; from 0 to 1, perc.
MAX_SLIDE_ANGLE = 60 ; Maximum slide-follow angle before strength is applied; from 0 to 85, round to 1
SMOOTHING = 1 ; Smoothing multiplier (higher is slower); from 0.35 to 2.5, round to 0.05
LOOK_AHEAD = 1 ; Aim ahead of the car while moving forward; from 0 m to 3, round to 0.1
HORIZON_LOCK = 0.95 ; Horizon stability (100% keeps the horizon level); from 0 to 1, perc.
SLOPE_FOLLOW = 1 ; Follow the car's pitch on slopes; from 0 to 1, perc.
__HINT_BOTTOM = Driving is more responsive; Cinematic is smoother, wider and slightly tighter in field of view. These settings replace the car's normal chase-camera framing. Start with Driving on Brooklyn Park. Camera obstruction avoidance is not included.
